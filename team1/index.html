<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마음톡톡AI</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./css/style.css" />

    <!-- js -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="./js/commons.js"></script>
    <script src="./js/center.js"></script>
</head>

<body>
    <div id="wrap">
        <header id="header">
            <div class="inner">
                <div class="logo">
                    <a href="index.html">마음톡톡AI<i class="fa-solid fa-heart"></i></a>
                </div>
                <button type="button" class="menuBtn" id="menuBtn"><i class="fa-solid fa-bars"></i></button>
            </div>
        </header>
        <aside class="menu" id="menu">
            <div class="bg"></div>
            <div class="menuwrap">
                <button type="button" class="closeBtn" id="closeBtn"><i class="fa-solid fa-xmark"></i></button>
                <ul class="inner">
                    <li><a href="#">AI상담</a></li>
                    <li><a href="#">자가진단</a></li>
                    <li><a href="#">전화상담 안내</a></li>
                    <li><a href="#">정신건강센터 안내</a></li>
                </ul>
            </div>
        </aside>
        <section id="emergency">
           <div class="inner">
                <div class="tit">
                    <h3>정신건강센터 안내</h3>
                    <ul>
                        <li><strong><span>자살예방 상담전화</span> - ☎ 1393</strong></li>
                        <li><span>정신건강 위기상담전화</span> - ☎ 1577‑0199</li>
                    </ul>
                    <button class="./tel.html">지역별 상담 안내</button>
                </div>
                <div class="emerSearch">
                    <div class="emer_addr">
                        <h4>지역별로 검색</h4>
                        <div class="search">
                            <select name="rdnmadr" id="rdnmadr">
                                <option>서울특별시</option>
                                <option>경기도</option>
                                <option>인천광역시</option>
                                <option>강원도</option>
                                <option>충청북도</option>
                                <option>충청남도</option>
                                <option>대전광역시</option>
                                <option>세종특별자치시</option>
                                <option>전라북도</option>
                                <option>전라남도</option>
                                <option>경상북도</option>
                                <option>경상남도</option>
                                <option>부산광역시</option>
                                <option>대구광역시</option>
                                <option>울산광역시</option>
                                <option>제주특별자치도</option>
                            </select>
                            <button type="button" class="btn" onclick="searchCenter(1)">검색</button>
                        </div>
                    </div>
                    <div class="emer_addr emer_map">
                        <h4>가까운 센터 검색<br/>(위치정보 제공 동의 필수)</h4>
                        <div class="search_map">
                            <button type="button" class="btn" onclick="searchCenter(2)">내 주변 검색</button>
                        </div>
                    </div>
                </div>
           </div>
            <div class="emerContents">
                <div class="inner">
                    <div class="col-em"></div>
                </div>
            </div>
        </section>
    </div>

</body>

</html>
